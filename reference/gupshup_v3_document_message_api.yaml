openapi: 3.0.3
info:
  title: Gupshup V3 Document Session Message API
  description: API for sending document messages via WhatsApp through Gupshup V3 platform
  version: 1.0.0
servers:
  - url: https://partner.gupshup.io/partner/app/{appId}/v3
    variables:
      appId:
        default: 07c7c72d-20e3-4ff9-a5a1-14d1186eeec8
        description: Your Gupshup App ID
paths:
  /message:
    post:
      summary: Document message
      description: >-
        Send a V3 document message to a WhatsApp user using either a media ID or
        a hosted link
      operationId: sendDocumentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMessageRequest'
            examples:
              withMediaId:
                summary: Document message using media ID
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: '917506080480'
                  type: document
                  document:
                    id: '1021671987023570'
                    caption: Please find the document attached
                    filename: demo.txt
              withHostedLink:
                summary: Document message using hosted link
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: '917506080480'
                  type: document
                  document:
                    link: >-
                      https://raw.githubusercontent.com/dwyl/english-words/master/words.txt
                    caption: Please find the document attached
                    filename: demo.txt
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                messages:
                  - id: GUPSHUP_MESSAGE_ID
                messaging_product: whatsapp
                contacts:
                  - input: DESTINATION_PHONE_NO
                    wa_id: DESTINATION_PHONE_NO
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                callbackBillingError:
                  summary: Callback billing not enabled
                  value:
                    message: Callback Billing must be enabled for this API
                    status: error
                invalidAppError:
                  summary: Invalid app details
                  value:
                    message: Invalid App Details
                    status: error
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Authentication Failed
      security:
        - ApiKeyAuth: []
components:
  schemas:
    DocumentMessageRequest:
      type: object
      required:
        - messaging_product
        - recipient_type
        - to
        - type
        - document
      properties:
        messaging_product:
          type: string
          enum:
            - whatsapp
          description: The messaging product used (currently only whatsapp)
          example: whatsapp
        recipient_type:
          type: string
          enum:
            - individual
          description: The type of recipient (currently only individual)
          example: individual
        to:
          type: string
          description: Destination phone number in E.164 format
          example: '917506080480'
        type:
          type: string
          enum:
            - document
          description: Message type (document for this API)
          example: document
        document:
          type: object
          description: Document object containing document details
          properties:
            id:
              type: string
              description: Media Object ID (required if not using link)
              example: '1021671987023570'
            link:
              type: string
              format: uri
              description: Publicly hosted URL of the document (required if not using id)
              example: >-
                https://raw.githubusercontent.com/dwyl/english-words/master/words.txt
            caption:
              type: string
              maxLength: 1024
              description: Description of the document (optional)
              example: Please find the document attached
            filename:
              type: string
              description: Custom filename for the document (optional)
              example: demo.txt
          oneOf:
            - required:
                - id
            - required:
                - link
    SuccessResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Gupshup message ID
                example: GUPSHUP_MESSAGE_ID
        messaging_product:
          type: string
          description: Messaging product used
          example: whatsapp
        contacts:
          type: array
          items:
            type: object
            properties:
              input:
                type: string
                description: Input phone number
                example: DESTINATION_PHONE_NO
              wa_id:
                type: string
                description: WhatsApp ID of the contact
                example: DESTINATION_PHONE_NO
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: Error status
          example: error
        message:
          type: string
          description: Error message description
          example: Authentication Failed
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key in the format sk_xxxxxxxxxxxxxxxxxxxxxxxx
